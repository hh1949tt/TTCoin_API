# Cloudflare Worker 配置
#
# 部署：npx wrangler deploy
# 本地：npx wrangler dev
#
# 先不配 routes，发到 workers.dev 上验证；确认没问题再取消注释，
# 让 Worker 接管正式路径（手表地址一个字都不用改）。

name = "ttcoin-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# 行情显示配置（face 滚屏 / 固定 + 三端共用的主币种）—— 仅本地测试，暂不发布。
# 与 PHP 版 config.php 的配置项一一对应，wrangler dev / deploy 都会读这一段。
#   FACE_MODE    scroll 滚屏 / fixed 固定（只回一个币）
#   FACE_ORDER   表盘独立的币种轮播顺序，按 base 匹配，逗号分隔
#   FACE_FIXED   fixed 模式固定显示哪个币（留空 = ORDER 第一项）
#   FACE_TOP_N   scroll 模式最多回几条，0 = 按 ORDER 全给
#   FACE_COIN    三端共用的主币种（留空 = 默认币种）：face 的 fixed / 滚屏
#                第一位、app / widget 列表的第一位都换成它。支持逗号分隔的
#                多币种优先级列表（如 "BTC,ETH"），fixed 模式取列表第一个
#   FACE_IDS     按 ID 覆盖（JSON）：三个客户端请求都带 ?id=（手机端
#                「行情配置 ID」），登记了哪个 id 就按登记的键覆盖默认一套
#                （mode/order/fixed/topN/coin 写哪个覆盖哪个，coin 比 fixed
#                优先）；没登记 / 没带 id 走默认一套（默认币种）。
#                下面是测试用示例：11111111 固定 DOGE，22222222 滚播，
#                33333333 主币种换 BTC（coin 也支持多币种列表）。
#   CHANGE_MODE  涨幅口径：'24h'（默认，上游滚动 24 小时）/
#                'tz'（指定时区的自然日涨幅，以当地 00:00 开盘价为基准）
#   CHANGE_TZ    固定 UTC 偏移（不换算夏令时），东八区写 '8'；
#                0/Z = UTC，-5 = 美东标准时，5:30 或 5.5 = 印度。
#                tz 模式的日开盘价按「时区 + 当地日期」缓存，一天最多抓一轮，
#                抓不到的币自动退回 24h；改配置最多 60 秒（FRESH_TTL）生效。
#   LOG_REQUESTS 每请求一行 JSON 日志（console.log，wrangler tail 可看）：
#                '1' 默认开（含 id / uid / 客户端 IP / 缓存命中情况），
#                '0' 全关。Worker 没有文件系统，日志只能走 console.log /
#                Workers Logs，或另接 Analytics Engine（额外计费，默认不接）。
[vars]
FACE_MODE = "scroll"
FACE_ORDER = "DOGE,BTC,ETH,SHIB,SOL,BNB,XRP,ADA,LINK,LTC,AVAX"
FACE_FIXED = "DOGE"
FACE_TOP_N = "0"
FACE_IDS = '{"11111111":{"mode":"fixed","fixed":"DOGE"},"22222222":{"mode":"scroll"},"33333333":{"coin":"BTC"}}'
CHANGE_MODE = "24h"
CHANGE_TZ = "8"
LOG_REQUESTS = "1"
# KV 请求日志（后台「请求日志」页）：每 2 分钟或攒满 12 条写一次 KV，
# 保留天数与条数上限也能在后台改。不绑 KV 时这些值无效，只留 console 日志。
LOG_KV = "1"
LOG_KV_KEEP = "7"
LOG_KV_MAX = "200"

# 正式接管：域名必须托管在同一个 Cloudflare 账号下。
#
# 末尾那个 `*` 不能省：CF 的路由匹配把查询串算进整条 URL，而模式里又不许写
# `?foo=*`。所以 `.../coin.php` 只能匹配「不带参数」的请求，手表每次带的
# `?type=app` 会漏回源站（实测就是 521）。官方文档原文：
#   "the only way to have a route pattern match URLs with query parameters
#    is to terminate it with a wildcard, *"
# routes = [
#   { pattern = "your-domain.example/coin.php*", zone_name = "example.com" }
# ]

# 可选：日志保留，排查 403 / 上游异常时有用（免费版也有 3 天）
# [observability]
# enabled = true

# ---------------------------------------------------------------------------
# 网页后台 /admin（可选，一次性设置）：
#   ① 建一个 KV namespace，把输出的 id 填到下面并取消注释：
#        npx wrangler kv namespace create SETTINGS
#   ② 设置后台登录口令（不要写进本文件，secret 不进代码库）：
#        npx wrangler secret put ADMIN_TOKEN
#   ③ npx wrangler deploy → 浏览器打开 https://<你的 workers 域名>/admin
# 后台改的配置存 KV（键 admin_settings），保存约 30 秒全局生效，无需重新
# deploy；没绑 KV / 没设口令时行情出口完全不受影响（走上面 [vars] 默认）。
# 注意：ADMIN_TOKEN 是后台最高权限（能改全部行情配置），口令务必够长。
# ---------------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "SETTINGS"
# id = "<npx wrangler kv namespace create SETTINGS 输出的 id>"

# ---------------------------------------------------------------------------
# 定时清理过期日志（可选但建议）。每天 03:23 UTC 触发一次 scheduled()，
# 把 KV 里超过保留天数的记录裁掉。不配也不会无限增长——每次刷盘都会顺带
# 按保留期/条数裁剪，Cron 只是「长时间没有请求」时的兜底。
# 控制台部署的话：Worker → Settings → Triggers → Cron Triggers → 填 23 3 * * *
# ---------------------------------------------------------------------------
# [triggers]
# crons = ["23 3 * * *"]
